# Receita de compilação do servidor SSH Dropbear para o Allwinner A33 (Cortex-A7).
# Compilação hermética via container Debian Bookworm (cores/toolchain).

[servico]
nome = "dropbear"
versao = "2024.86"
saida = ["dropbear", "dropbearkey"]

[fonte]
url = "https://matt.ucc.asn.au/dropbear/releases/dropbear-2024.86.tar.bz2"
sha256 = "e78936dffc395f2e0db099321d6be659190966b99712b55c530dd0a1822e0a5e"

[flags]
cflags = [
    "-pipe", "-O2",
    "-mcpu=cortex-a7", "-mfpu=neon-vfpv4", "-mfloat-abi=hard",
    "-fvisibility=hidden", "-ffunction-sections", "-fdata-sections"
]
ldflags = ["-s", "-Wl,--gc-sections"]
