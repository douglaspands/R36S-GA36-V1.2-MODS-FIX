# Receita de compilação do runtime LÖVE 11.5 standalone para o Allwinner A33 (Cortex-A7).
# Compilação hermética via container Debian Bookworm.

[port]
nome = "love"
versao = "11.5"
saida = "love"

[fonte]
repo = "https://github.com/love2d/love"
url = "https://github.com/love2d/love/releases/download/11.5/love-11.5-linux-src.tar.gz"
sha256 = "066e0843f71aa9fd28b8eaf27d41abb74bfaef7556153ac2e3cf08eafc874c39"

[flags]
cflags = [
    "-pipe", "-fno-math-errno", "-O3",
    "-mcpu=cortex-a7", "-mfpu=neon-vfpv4", "-mfloat-abi=hard",
    "-DLOVE_GRAPHICS_USE_OPENGLES=1",
]
cxxflags = [
    "-pipe", "-fno-math-errno", "-O3",
    "-mcpu=cortex-a7", "-mfpu=neon-vfpv4", "-mfloat-abi=hard",
    "-DLOVE_GRAPHICS_USE_OPENGLES=1",
]
ldflags = ["-s", "-Wl,--gc-sections"]
