# Receita de compilação do port nativo ClassiCube para o Allwinner A33 (Cortex-A7).
# Compilação hermética via container Debian Bookworm (cores/toolchain).

[port]
nome = "classicube"
versao = "1.3.9"
saida = "ClassiCube"

[fonte]
repo = "https://github.com/ClassiCube/ClassiCube"
commit = "24617284a36f34def8e5ad960f737e48ee6c0058"
url = "https://github.com/ClassiCube/ClassiCube/archive/refs/tags/1.3.9.tar.gz"
sha256 = "5bb62dbb3ad27e1fbb09842f0cb1f4802b2686553b017e0b67ce09b36f908246"

[flags]
cflags = [
    "-pipe", "-fno-math-errno", "-O2",
    "-mcpu=cortex-a7", "-mfpu=neon-vfpv4", "-mfloat-abi=hard",
    "-fvisibility=hidden", "-fno-ident",
    "-DCC_BUILD_SDL2", "-DCC_BUILD_GLES",
    "-DCC_WIN_BACKEND=2", "-DCC_GFX_BACKEND=3",
]
libs = ["-lSDL2", "-lGLESv2", "-lEGL", "-lpthread", "-ldl", "-lm"]
ldflags = ["-s", "-Wl,--gc-sections"]
