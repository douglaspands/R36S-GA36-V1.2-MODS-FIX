[project]
name = "r36img"
version = "0.1.0"
description = "Build e gravação de imagens de cartão SD para o R36S (GA36-MB V1.2)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# O pacote vive em tools/ e é carregado pelos wrappers; não há o que instalar.
package = false

[tool.uv.sources]
agent-harness-hub = { git = "https://github.com/douglaspands/agent-harness-hub", rev = "main" }

[dependency-groups]
dev = [
    "agent-harness-hub",
    "pillow>=13.0.0",
]
