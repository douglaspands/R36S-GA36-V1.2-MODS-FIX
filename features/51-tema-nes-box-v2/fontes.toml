# Origem da arte acrescentada ao NES-BOX-V2. Lido pelo gerar.sh e pelo teste
# tests/test_tema_nes_box_v2.py.
#
# [referencias]: sistemas que só diferem de um existente no nome. A pasta nova
# tem só o theme.xml, apontando para a arte da pasta equivalente do V2.
#
# [[arte]]: um item por arquivo de arte nova (sistema, arquivo, tipo, e para
# "oficial" a url e o sha256 do arquivo baixado).

[referencias]
"pce-cd" = "pcenginecd"
"tic-80" = "tic80"
"sharpx1" = "x1"
"prboom" = "doom"
"ecwolf" = "wolf"
"megadrivemsu" = "megadrive"
"ggh" = "gamegear"

# Campos de [[arte]]:
#   sistema, arquivo (system.png ou background_icon.png), tipo ("oficial" ou "criado").
#   oficial: url, sha256 do arquivo baixado, cache (nome dele em work/cache/nes-box-v2/),
#            fonte (quem publica, e a licença) e ajuste opcional ("fundo-branco" tira o fundo branco).
#   criado:  motivo (por que não usou arte oficial), icone (fonte-<icone>.svg, Lucide, ISC),
#            texto (nome no logo) ou cor (fundo do círculo da arte de personagem).
# Toda a arte oficial veio do Wikimedia Commons (logos de marca com a restrição
# "trademarked": uso pessoal nesta imagem, como descrito no LEIA-ME.txt).

[[arte]]
sistema = "wii"
arquivo = "system.png"
tipo = "oficial"
cache = "Wii.svg"
url = "https://upload.wikimedia.org/wikipedia/commons/b/bc/Wii.svg"
sha256 = "f7890d3a836e3cca1b81aea8cf28ffd4b3f5015ff3ae10ce15282650ecac1702"
