# Tema padrão do EmulationStation: Epic Cody ML na partição p8 (/storage).
# O tema unificado é configurado em es_settings.cfg com suporte dinâmico a múltiplos idiomas.
# O build baixa o tema de um commit fixo, confere o sha256 e guarda em work/cache/external/.

schema = 1
name = "Tema Epic Cody ML"
description = "Tema curado Epic Cody ML com suporte dinâmico a idiomas e identidade unificada."
order = 50
enabled = true
budget_mib = 250

[[external]]
layer = "storage"
dest = ".config/emulationstation/themes/Epic Cody ML"
url = "https://codeload.github.com/CodyV59/es-theme-epic-cody-RG351V/tar.gz/b810e33851f2df0f86e9e2570cddab3a40961f8f"
sha256 = "4a0d1e11850e0a1f0ae54ba3f4c067aefa44751e6fa7996a799493308dbe5d55"
strip = 1
exclude = [".git*", "*.md", "theme.xml", "*/theme.xml", "_art/var/button.svg", "_art/ingame-global-bg.*"]
