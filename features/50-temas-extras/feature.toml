# Temas extras do EmulationStation, instalados na p8 ao lado do NES-BOX (que
# continua sendo o tema padrão). O build baixa cada tema de um commit fixo,
# confere o sha256 e guarda em work/cache/external/. Os temas não entram no git.
# Escolha no aparelho: Menu > Configurações da interface > Tema.
# Ficam no /storage, então só chegam com --wipe-storage.

schema = 1
name = "Temas extras"
description = "Temas Minimal, Switch, Graphite e Crystal para o EmulationStation."
order = 50
enabled = true
budget_mib = 400

[[external]]
layer = "storage"
dest = ".config/emulationstation/themes/Minimal EmuELEC"
url = "https://codeload.github.com/EmuELEC/es-theme-minimal-EmuELEC/tar.gz/628546bade3c08a3904c4105fab35c8d1ae49432"
sha256 = "31ebe08db71bc1a8ab30ee387acbc01617fc2e257dedfa9095cc87c92b48724d"
strip = 1
exclude = [".git*", "*.md", "screenshots/*"]

[[external]]
layer = "storage"
dest = ".config/emulationstation/themes/Switch"
url = "https://codeload.github.com/Jetup13/es-theme-switch/tar.gz/2066a6e21569590fc94ab875921e575c798785fa"
sha256 = "7ea436d346da1a0d8f9ae3a0bffcfd20276a7906ba157219d4e8bb22c92a24c7"
strip = 1
exclude = [".git*", "*.md", "screenshots/*"]

[[external]]
