dest = ".config/emulationstation/themes/Graphite OGA"
url = "https://codeload.github.com/mtoensing/es-theme-Graphite-OGA/tar.gz/88d5c479f97f5f592d6dab861ebca23b0bbb830d"
sha256 = "b124fbe13f091c7041ca5634943d65229c5485caa9a8f36aaf2dd5481e362e75"
strip = 1
exclude = [".git*", "*.md", "screenshots/*"]

[[external]]
layer = "storage"
dest = ".config/emulationstation/themes/Crystal"
