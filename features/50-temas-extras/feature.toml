# Temas extras do EmulationStation, instalados na p8 ao lado do NES-BOX (que
# continua sendo o tema padrão). O build baixa cada tema de um commit fixo,
# confere o sha256 e guarda em work/cache/external/. Os temas não entram no git.
# Escolha no aparelho: Menu > Configurações da interface > Tema.
# Ficam no /storage, então só chegam com --wipe-storage.
#
# Fora da lista por estourar os 400 MiB (16:9, a validar em 4:3): PokemonUno,
# KirbyUno e YoshiUno, de RetroHursty69 (es-theme-<nome>).

schema = 1
name = "Temas extras"
description = "Temas Mario, Sonic, Crash, Minimal, Switch, Graphite e Crystal para o EmulationStation."
order = 50
enabled = true
budget_mib = 400

[[external]]
layer = "storage"
dest = ".config/emulationstation/themes/Mario (GPi)"
url = "https://codeload.github.com/RetroHursty69/es-theme-GPi_Mario/tar.gz/d64fa52e0b5c775c0de6493ddb8dc0d41cb1e59a"
sha256 = "b0e64a8104c09e5c48fce3368e2cc55c8b10834af896c0723f36799688139065"
strip = 1
exclude = [".git*", "*.md", "screenshots/*"]

