# Configuração do OpenAL Soft de alta fidelidade e nitidez para o R36S clone (Allwinner A33 / sunxi-pcm-codec)
[general]
drivers = alsa
channels = stereo
sample-type = int16
frequency = 48000
period_size = 1024
periods = 4
resampler = bsinc12
dither = false
dither-depth = 0
output-limiter = false
volume-adjust = -3
stereo-mode = speakers
stereo-encoding = pan
hrtf = false

[alsa]
device = default
mmap = false
allow-resampler = false
