# Shaders para Game Boy Advance (GBA) no R36S (Allwinner A33).
# Instala o shader gba-modern-remaster (correção cromática sRGB D65 e
# interpolação adaptativa de bordas) em /usr/share/common-shaders/gba, a pasta
# de baixo do overlay /tmp/shaders. Não fica ligado por padrão: o usuário o
# escolhe no EmulationStation (opção "SHADER SET"), que lista /tmp/shaders.

schema = 1
name = "Shaders GBA"
description = "Shader gba-modern-remaster (correção de cor sRGB D65 e suavização sem cintilação), desligado por padrão e selecionável no SHADER SET do EmulationStation."
order = 54
enabled = true
