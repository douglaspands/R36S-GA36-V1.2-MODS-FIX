schema = 1
name = "Serviços enxutos"
description = "Não sobe no boot o controle remoto IR (lircd, eventlircd), o cron, o relógio por rede (systemd-timesyncd) nem o pulseaudio, que o R36S não usa."
order = 41
enabled = true

# Só os links de ativação saem; as units e os binários ficam, então qualquer
# serviço pode ser religado depois.

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/sockets.target.wants/lircd.socket"

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/multi-user.target.wants/lircd.service"

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/multi-user.target.wants/lircd-uinput.service"

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/multi-user.target.wants/eventlircd.service"

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/multi-user.target.wants/cron.service"

# Sem rede nem Wi-Fi, o NTP não tem com quem falar; o daemon (Restart=always) ficava na RAM.
[[remove]]
layer = "system"
path = "usr/lib/systemd/system/sysinit.target.wants/systemd-timesyncd.service"

[[remove]]
layer = "system"
path = "usr/lib/systemd/system/sysinit.target.wants/systemd-timesyncd-setup.service"

# O som é ALSA: o emustation-config (set_audio default -> rr_audio.sh alsa) para o
# pulseaudio segundos depois do boot. O rr_audio.sh ainda o religa se alguém escolher
# o backend PulseAudio.
[[remove]]
layer = "system"
path = "usr/lib/systemd/system/multi-user.target.wants/pulseaudio.service"
